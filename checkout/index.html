<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title></title>
		<meta
			name="description"
			content="RainyDays - RainyDays is a company that sells high quality rainjackets and outerwear"
		/>
		<script
			src="https://kit.fontawesome.com/0c6f9a3b2b.js"
			crossorigin="anonymous"
		></script>
		<link rel="stylesheet" href="../css/checkout.css" />
	</head>
	<body>
		<header>
			<nav>
				<a href="../index.html"
					><img
						src="../assets/logo/RainyDays_Logo-alt-small-var1.png"
						alt="RainyDays Logo"
						class="nav-logo"
				/></a>
				<a href="../shopping-cart/index.html"
					><i
						id="shopping-cart"
						class="fa-solid fa-cart-shopping"
						alt="RainyDays Shopping-cart"
					></i
					><span id="cart-count">0</span></a
				>
			</nav>
		</header>
		<h1>Order Confirmation</h1>
		<section class="checkout-container">
			<section class="cart-summary">
				<section class="cart-items" id="cart-items"></section>
				<section class="cart-total">
					<p>Total: <span id="total-price">$0</span></p>
				</section>
			</section>
			<section class="input-section">
				<fieldset class="first">
					<legend>First Name</legend>
					<input type="text" id="input-first" name="firstname" />
				</fieldset>
				<fieldset class="sur">
					<legend>Surname</legend>
					<input type="text" id="input-sur" name="surname" />
				</fieldset>
				<fieldset class="mail">
					<legend>Email</legend>
					<input type="mail" id="input-mail" name="email" />
				</fieldset>
				<fieldset class="address">
					<legend>Address</legend>
					<input type="text" id="input-address" name="address" />
				</fieldset>
				<fieldset class="postal">
					<legend>Postal Code</legend>
					<input type="number" id="input-postal" name="postalcode" />
				</fieldset>
				<fieldset class="city">
					<legend>City</legend>
					<input type="text" id="input-city" name="city" />
				</fieldset>
				<fieldset class="card">
					<legend>Card Number</legend>
					<input type="number" id="input-card" name="cardnumber" />
				</fieldset>
				<fieldset class="expiry">
					<legend>Expiry Date</legend>
					<input type="number" id="input-expiry" name="expirydate" />
				</fieldset>
				<fieldset class="cvc">
					<legend>CVC</legend>
					<input type="number" id="input-cvc" name="cvc" />
				</fieldset>
			</section>
		</section>
		<section class="submit-button">
			<button id="submit-order">Submit Order</button>
		</section>
		<section class="bottom-section">
			<img
				id="bottom-img"
				src="../assets/checkout-bottom.jpg"
				alt="2 people wandering on the forest"
			/>
			<img
				src="../assets/logo/RainyDays_Logo.png"
				alt="RainyDays Logo"
				id="bottom-logo"
			/>
		</section>
		<footer>
			<ul class="footer-icons">
				<li><i class="fa-brands fa-facebook" id="facebook"></i></li>
				<li><i class="fa-brands fa-instagram" id="instagram"></i></li>
				<li><i class="fa-brands fa-youtube" id="youtube"></i></li>
			</ul>
		</footer>
		<script type="module" src="../js/checkout.js"></script>
	</body>
</html>
