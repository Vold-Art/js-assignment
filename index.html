<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rainy Days - Home</title>
		<meta
			name="description"
			content="RainyDays - RainyDays is a company that sells high quality rainjackets and outerwear"
		/>
		<script
			src="https://kit.fontawesome.com/0c6f9a3b2b.js"
			crossorigin="anonymous"
		></script>
		<link rel="stylesheet" href="./css/index.css" />
	</head>
	<body>
		<header>
			<nav>
				<a href="./index.html"
					><img
						src="./assets/logo/RainyDays_Logo-alt-small-var1.png"
						alt="RainyDays Logo"
						class="nav-logo"
				/></a>
				<a href="./shopping-cart/shopping-cart.html"
					><i
						id="shopping-cart"
						class="fa-solid fa-cart-shopping"
						alt="RainyDays Shopping-cart"
					></i
				></a>
			</nav>
		</header>
		<section class="hero-section">
			<img
				id="hero-img"
				src="./assets/index-hero.jpg"
				alt="Man hiking in the mountains with a view"
			/>
			<img
				src="./assets/logo/RainyDays_Logo-alt.png"
				alt="RainyDays Logo"
				id="hero-logo"
			/>
		</section>
		<section class="filter-bar">
			<label for="gender">Gender:</label>
			<select id="gender">
				<option value="all">All</option>
				<option value="men">Men</option>
				<option value="women">Women</option>
				<option value="unisex">Unisex</option>
			</select>

			<label for="size">Size:</label>
			<select id="size">
				<option value="all">All</option>
				<option value="S">Small</option>
				<option value="M">Medium</option>
				<option value="L">Large</option>
				<option value="XL">XL</option>
			</select>
		</section>
		<section class="product-section">
			<div id="product-list"></div>
		</section>
		<footer>
			<ul class="footer-icons">
				<li><i class="fa-brands fa-facebook" id="facebook"></i></li>
				<li><i class="fa-brands fa-instagram" id="instagram"></i></li>
				<li><i class="fa-brands fa-youtube" id="youtube"></i></li>
			</ul>
		</footer>
		<script src="./js/script.js"></script>
	</body>
</html>
