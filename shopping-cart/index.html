<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rainy Days - Home</title>
		<meta
			name="description"
			content="RainyDays - RainyDays is a company that sells high quality rainjackets and outerwear"
		/>
		<script
			src="https://kit.fontawesome.com/0c6f9a3b2b.js"
			crossorigin="anonymous"
		></script>
		<link rel="stylesheet" href="../css/shopping-cart.css" />
	</head>
	<body>
		<header>
			<nav>
				<a href="../index.html"
					><img
						src="../assets/logo/RainyDays_Logo-alt-small-var1.png"
						alt="RainyDays Logo"
						class="nav-logo"
				/></a>
				<a href="../shopping-cart/index.html"
					><i
						id="shopping-cart"
						class="fa-solid fa-cart-shopping"
						alt="RainyDays Shopping-cart"
					></i
					><span id="cart-count">0</span></a
				>
			</nav>
		</header>
		<div class="cart-container">
			<h1>Your Shopping Cart</h1>
			<div class="cart-items" id="cart-container"></div>
			<div class="cart-summary">
				<p><strong>Total:</strong> $<span id="cart-total">0.00</span></p>
				<a href="../checkout/index.html"
					><button id="checkout-btn">Proceed to Checkout</button></a
				>
			</div>
		</div>
		<section class="bottom-section">
			<img
				id="bottom-img"
				src="../assets/shopping-cart-bottom.jpg"
				alt="View of a Snowy mountain range"
			/>
			<img
				src="../assets/logo/RainyDays_Logo.png"
				alt="RainyDays Logo"
				id="bottom-logo"
			/>
		</section>
		<div id="loader" class="hidden">
			<div class="spinner"></div>
		</div>
		<footer>
			<ul class="footer-icons">
				<li><i class="fa-brands fa-facebook" id="facebook"></i></li>
				<li><i class="fa-brands fa-instagram" id="instagram"></i></li>
				<li><i class="fa-brands fa-youtube" id="youtube"></i></li>
			</ul>
		</footer>
		<script type="module" src="../js/shopping-cart.js"></script>
	</body>
</html>
