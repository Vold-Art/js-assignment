<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title></title>
		<meta
			name="description"
			content="RainyDays - RainyDays is a company that sells high quality rainjackets and outerwear"
		/>
		<script
			src="https://kit.fontawesome.com/0c6f9a3b2b.js"
			crossorigin="anonymous"
		></script>
		<link rel="stylesheet" href="../css/product.css" />
	</head>
	<body>
		<header>
			<nav>
				<a href="../index.html"
					><img
						src="../assets/logo/RainyDays_Logo-alt-small-var1.png"
						alt="RainyDays Logo"
						class="nav-logo"
				/></a>
				<a href="../shopping-cart/index.html"
					><i
						id="shopping-cart"
						class="fa-solid fa-cart-shopping"
						alt="RainyDays Shopping-cart"
					></i
					><span id="cart-count">0</span></a
				>
			</nav>
		</header>
		<section class="product-details">
			<div id="product-container"></div>
		</section>
		<section class="bottom-section">
			<img
				id="bottom-img"
				src="../assets/product-page-bottom.jpg"
				alt="Woman with child hiking in a forest"
			/>
			<img
				src="../assets/logo/RainyDays_Logo.png"
				alt="RainyDays Logo"
				id="bottom-logo"
			/>
		</section>
		<div id="loader" class="hidden">
			<div class="spinner"></div>
		</div>
		<footer>
			<ul class="footer-icons">
				<li><i class="fa-brands fa-facebook" id="facebook"></i></li>
				<li><i class="fa-brands fa-instagram" id="instagram"></i></li>
				<li><i class="fa-brands fa-youtube" id="youtube"></i></li>
			</ul>
		</footer>
		<script type="module" src="../js/product.js"></script>
	</body>
</html>
